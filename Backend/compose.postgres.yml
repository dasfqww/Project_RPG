services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: project_rpg
      POSTGRES_USER: project_rpg
      POSTGRES_PASSWORD: project_rpg_dev_only
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_rpg -d project_rpg"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - project_rpg_postgres_data:/var/lib/postgresql/data

volumes:
  project_rpg_postgres_data:
